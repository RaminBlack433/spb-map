<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Питер за 3 дня 🌉</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --accent: #1B365D;
    --day1: #1B365D;
    --day2: #C9A227;
    --day3: #7B2D26;
    --rain: #6B6B6B;
    --start: #2F8F4E;
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --line: #e5e7eb;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    overflow: hidden;
  }
  header {
    padding: 12px 16px 6px;
    background: #fff;
    z-index: 500;
  }
  header h1 {
    margin: 0 0 2px 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }
  header .subtitle {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }
  .tabs {
    display: flex;
    gap: 6px;
    padding: 8px 16px 0;
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: #f3f4f6;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    font-family: inherit;
  }
  .tab.active {
    background: var(--accent);
    color: white;
  }
  .rain-toggle {
    margin: 8px 16px 10px;
    padding: 10px;
    background: #f3f4f6;
    border: none;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    width: calc(100% - 32px);
    transition: background 0.2s, color 0.2s;
    font-family: inherit;
    color: var(--text);
  }
  .rain-toggle.active {
    background: var(--rain);
    color: white;
  }
  #map {
    flex: 1;
    width: 100%;
    z-index: 1;
  }
  .marker-pin {
    width: 32px; height: 32px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    border: 2px solid white;
  }
  .marker-pin span {
    transform: rotate(45deg);
    color: white;
    font-weight: 700;
    font-size: 13px;
    line-height: 1;
  }
  .marker-rain {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--rain);
    border: 2px solid white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
  }
  .marker-start {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--start);
    border: 3px solid white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }
  .bottom-sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #fff;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
    z-index: 600;
    max-height: 75vh;
    transform: translateY(calc(100% - 50px));
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
  }
  .bottom-sheet.open { transform: translateY(0); }
  .sheet-handle {
    padding: 8px 16px 6px;
    cursor: pointer;
    user-select: none;
    text-align: center;
  }
  .sheet-handle .bar {
    width: 40px; height: 4px;
    background: #d1d5db;
    border-radius: 2px;
    margin: 0 auto 6px;
  }
  .sheet-handle .label {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .sheet-list {
    overflow-y: auto;
    padding: 4px 12px 24px;
    -webkit-overflow-scrolling: touch;
  }
  /* Route step (place/start/finish) */
  .step {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }
  .step:active { background: #f3f4f6; }
  .step-num {
    width: 30px; height: 30px;
    border-radius: 50%;
    color: white;
    font-weight: 700;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .step-num.start { background: var(--start); font-size: 16px; }
  .step-info { flex: 1; min-width: 0; }
  .step-name {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 2px;
    line-height: 1.25;
  }
  .step-meta {
    font-size: 12px;
    color: var(--muted);
  }
  .step-note {
    font-size: 12px;
    color: #555;
    margin-top: 4px;
    line-height: 1.4;
  }
  /* Transition between steps */
  .transition {
    margin: 2px 0 2px 26px;
    padding: 8px 12px 8px 20px;
    border-left: 2px dashed #cbd5e1;
    font-size: 12.5px;
    color: #444;
    line-height: 1.45;
    position: relative;
  }
  .transition-mode {
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
  }
  .transition-mode .ico {
    font-size: 15px;
  }
  .transition-mode .dur {
    color: var(--muted);
    font-weight: 500;
    font-size: 12px;
  }
  .transition-text {
    color: #444;
    margin-bottom: 6px;
  }
  .transition-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    background: #f3f4f6;
    border-radius: 8px;
    color: var(--accent);
    text-decoration: none;
    font-size: 11.5px;
    font-weight: 600;
  }
  .transition-btn:active { background: #e5e7eb; }
  /* Popup */
  .leaflet-popup-content-wrapper { border-radius: 14px; }
  .leaflet-popup-content {
    margin: 12px 14px;
    font-size: 13px;
    line-height: 1.45;
    width: 250px !important;
  }
  .popup-title {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .popup-meta {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 6px;
  }
  .popup-arrive {
    background: #f3f4f6;
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .popup-arrive-title {
    font-weight: 700;
    margin-bottom: 3px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .popup-arrive-text { color: #444; }
  .popup-note { margin-bottom: 10px; color: #333; }
  .popup-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .popup-btn {
    display: inline-block;
    padding: 7px 11px;
    background: var(--accent);
    color: white !important;
    text-decoration: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
  }
  .popup-btn.secondary {
    background: #f3f4f6;
    color: var(--accent) !important;
  }
  @media (min-width: 720px) {
    body { max-width: 720px; margin: 0 auto; box-shadow: 0 0 30px rgba(0,0,0,0.08); }
  }
</style>
</head>
<body>

<header>
  <h1>Питер за 3 дня 🌉</h1>
  <p class="subtitle" id="subtitle">День 1 — «Открыточный Питер»</p>
</header>

<div class="tabs">
  <button class="tab active" data-day="1">День 1</button>
  <button class="tab" data-day="2">День 2</button>
  <button class="tab" data-day="3">День 3</button>
</div>

<button class="rain-toggle" id="rainToggle">Показать места на случай дождя ☔</button>

<div id="map"></div>

<div class="bottom-sheet" id="sheet">
  <div class="sheet-handle" id="sheetHandle">
    <div class="bar"></div>
    <div class="label" id="sheetLabel">Пошаговый маршрут ↑</div>
  </div>
  <div class="sheet-list" id="sheetList"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  // База — точка старта/возврата
  const BASE = {
    name: 'Парк Победы (метро М2)',
    lat: 59.8661, lon: 30.3221,
    note: 'Точка старта и финиша каждого дня. Станция «Парк Победы» синей линии (М2), выход к Московскому проспекту.'
  };

  // Иконки и режимы Я.Картах по типу транспорта
  const MODE = {
    walk:  { icon: '🚶', label: 'Пешком',      ym: 'pd'   },
    metro: { icon: '🚇', label: 'Метро',       ym: 'mt'   },
    bus:   { icon: '🚌', label: 'Автобус',     ym: 'mt'   },

    taxi:  { icon: '🚕', label: 'Такси',       ym: 'auto' },
    boat:  { icon: '⛴️', label: '«Метеор»',    ym: 'auto' },
    mixed: { icon: '🚇', label: 'Метро + пешком', ym: 'mt' }

  const DAYS = {

        { name: 'Летний сад', lat: 59.9449379, lon: 30.3354879, time: '12:30', dur: '60 мин',

        { name: 'Исаакиевский собор + колоннада', lat: 59.933905, lon: 30.306485, time: '15:30', dur: '90 мин',

        { name: 'Медный всадник', lat: 59.9363783, lon: 30.3022304, time: '17:30', dur: '20 мин',
          arriveBy: { type: 'walk', dur: '~5 мин',
            text: '400 м вниз через Александровский сад на Сенатскую площадь.' },
          note: 'Тот самый памятник Петру I из поэмы Пушкина.' },

        { name: 'Ресторан Mansarda', lat: 59.93279, lon: 30.3037895, time: '19:00', dur: '120 мин',
          arriveBy: { type: 'walk', dur: '~5 мин',
            text: '350 м. Ресторан в БЦ на Почтамтской, 3-5, лифт на 7-й этаж. Столик у окна — бронировать заранее.' },

      returnTo: { type: 'taxi', dur: '~20 мин',
        text: 'От Дворцового моста — такси до «Парк Победы», ~500–700₽. Метро в это время уже закрыто.' }

    },

    3: {
      title: 'День 3 — «Эрмитаж и финал»',

      places: [

          arriveBy: { type: 'mixed', dur: '~30 мин',
            text: '«Парк Победы» → «Невский проспект» (М2, 7 ост., 18 мин). Пешком ~10 мин: по Большой Морской → выход на Дворцовую площадь → главный вход со стороны Зимнего дворца. Билет заранее на hermitagemuseum.org!' },
          note: 'Билеты ТОЛЬКО онлайн заранее. Закрыт по понедельникам. Выбрать 2-3 маршрута: парадные залы, павлин-часы, импрессионисты.' },

        { name: 'Петропавловская крепость', lat: 59.9500019, lon: 30.3166718, time: '15:00', dur: '150 мин',

            text: '1.5 км: через Дворцовый мост → Стрелка Васильевского острова (Ростральные колонны) → Биржевой мост → Иоанновский мост. Один из самых открыточных пеших маршрутов города.' },

      ],

        text: 'От Севкабеля — такси до «Парк Победы», ~600–800₽. Или метро: пешком 15 мин до «Василеостровской» (М3) → «Гостиный двор» → переход на «Невский проспект» (М2) → 7 ост. до «Парк Победы», ~50 мин.' }

  };

  const RAIN_PLACES = [
    { name: 'Русский музей, Михайловский дворец', lat: 59.938935, lon: 30.332168, note: 'Вся русская живопись: Айвазовский, Репин, Брюллов.' },
    { name: 'Музей Фаберже, Шуваловский дворец', lat: 59.937, lon: 30.343, note: 'Яйца Фаберже из императорской коллекции.' },
    { name: 'Юсуповский дворец на Мойке', lat: 59.929, lon: 30.299, note: 'Где убили Распутина, экскурсия с восковыми фигурами.' },
    { name: 'Дом Зингера / Дом книги', lat: 59.935, lon: 30.325, note: 'Кафе на 2-м этаже с видом на Казанский собор.' },
    { name: 'Музей Эрарта', lat: 59.929, lon: 30.236, note: 'Современное искусство, открыт до 22:00.' }
  ];

  const map = L.map('map', { zoomControl: true }).setView([59.94, 30.32], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  const dayLayer = L.layerGroup().addTo(map);
  const rainLayer = L.layerGroup();
  let currentDay = 1;
  let rainOn = false;

  function makeNumberIcon(num, color) {
    return L.divIcon({
      className: 'spb-marker',
      html: `<div class="marker-pin" style="background:${color}"><span>${num}</span></div>`,
      iconSize: [32, 42], iconAnchor: [16, 38], popupAnchor: [0, -34]
    });
  }
  function makeStartIcon() {
    return L.divIcon({
      className: 'spb-marker',
      html: `<div class="marker-start">🚩</div>`,
      iconSize: [36, 36], iconAnchor: [18, 18], popupAnchor: [0, -18]
    });
  }
  function makeRainIcon() {
    return L.divIcon({
      className: 'spb-marker',
      html: `<div class="marker-rain">☔</div>`,
      iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -18]
    });
  }

  function ymRoute(fromLat, fromLon, toLat, toLon, mode) {
    return `https://yandex.ru/maps/?rtext=${fromLat},${fromLon}~${toLat},${toLon}&rtt=${mode}`;
  }
  function ymPoint(lat, lon, name) {
    return `https://yandex.ru/maps/?rtext=~${lat},${lon}&rtt=auto&text=${encodeURIComponent(name)}`;
  }

  function transitionHtml(t, fromLat, fromLon, toLat, toLon) {
    const m = MODE[t.type] || MODE.walk;
    const url = ymRoute(fromLat, fromLon, toLat, toLon, m.ym);
    return `
      <div class="transition">
        <div class="transition-mode">
          <span class="ico">${m.icon}</span>
          <span>${m.label}</span>
          <span class="dur">· ${t.dur}</span>
        </div>
        <div class="transition-text">${t.text}</div>
        <a class="transition-btn" href="${url}" target="_blank" rel="noopener">Маршрут в Я.Картах →</a>
      </div>
    `;
  }

  function popupArriveHtml(t) {
    if (!t) return '';
    const m = MODE[t.type] || MODE.walk;
    return `
      <div class="popup-arrive">
        <div class="popup-arrive-title">${m.icon} ${m.label} · ${t.dur}</div>
        <div class="popup-arrive-text">${t.text}</div>
      </div>
    `;
  }

  function popupHtml(p, prevLat, prevLon) {
    const web = ymPoint(p.lat, p.lon, p.name);
    const meta = p.time ? `${p.time}${p.dur ? ' · ' + p.dur : ''}` : '';
    const arriveBlock = popupArriveHtml(p.arriveBy);
    let routeBtn = '';
    if (p.arriveBy && prevLat != null) {
      const m = MODE[p.arriveBy.type] || MODE.walk;
      const url = ymRoute(prevLat, prevLon, p.lat, p.lon, m.ym);
      routeBtn = `<a class="popup-btn secondary" href="${url}" target="_blank" rel="noopener">${m.icon} Маршрут сюда</a>`;
    }
    return `
      <div class="popup-title">${p.name}</div>
      ${meta ? `<div class="popup-meta">${meta}</div>` : ''}
      ${arriveBlock}
      <div class="popup-note">${p.note}</div>
      <div class="popup-btns">
        <a class="popup-btn" href="${web}" target="_blank" rel="noopener">Открыть в Я.Картах</a>
        ${routeBtn}
      </div>
    `;
  }

  function popupStartHtml() {
    return `
      <div class="popup-title">🚩 ${BASE.name}</div>
      <div class="popup-note">${BASE.note}</div>
    `;
  }

  function segmentStyle(type, color) {
    const base = { color, weight: 4, opacity: 0.8 };
    switch (type) {
      case 'walk':  return { ...base, dashArray: '2, 7', weight: 3 };
      case 'metro': return { ...base, dashArray: '16, 8', weight: 5 };
      case 'mixed': return { ...base, dashArray: '12, 6', weight: 4 };
      case 'taxi':  return { ...base, dashArray: '1, 6', weight: 3, opacity: 0.65 };
      case 'boat':  return { ...base, dashArray: '8, 4, 1, 4', weight: 4 };
      case 'bus':
      case 'train': return { ...base, dashArray: '10, 6', weight: 4 };
      default: return base;
    }
  }

  function renderDay(day) {
    currentDay = day;
    dayLayer.clearLayers();
    const data = DAYS[day];
    document.getElementById('subtitle').textContent = data.title;
    document.getElementById('sheetLabel').textContent = `Пошаговый маршрут · ${data.places.length} точек ↑`;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.day === String(day));
    });

    const markers = [];

    // Стартовая точка
    const startMarker = L.marker([BASE.lat, BASE.lon], { icon: makeStartIcon() })
      .bindPopup(popupStartHtml());
    startMarker.addTo(dayLayer);
    markers.push(startMarker);

    // Маркеры мест и сегменты маршрута
    let prevLat = BASE.lat, prevLon = BASE.lon;
    data.places.forEach((p, i) => {
      // Сегмент от предыдущей точки к текущей
      if (p.arriveBy) {
        const style = segmentStyle(p.arriveBy.type, data.color);
        L.polyline([[prevLat, prevLon], [p.lat, p.lon]], style).addTo(dayLayer);
      }
      // Маркер места
      const marker = L.marker([p.lat, p.lon], { icon: makeNumberIcon(i + 1, data.color) })
        .bindPopup(popupHtml(p, prevLat, prevLon));
      marker.addTo(dayLayer);
      markers.push(marker);
      prevLat = p.lat; prevLon = p.lon;
    });

    // Возвратный сегмент к базе
    if (data.returnTo) {
      const style = segmentStyle(data.returnTo.type, data.color);
      style.opacity = 0.5;
      L.polyline([[prevLat, prevLon], [BASE.lat, BASE.lon]], style).addTo(dayLayer);
    }

    // Подгонка границ
    const allPoints = [[BASE.lat, BASE.lon], ...data.places.map(p => [p.lat, p.lon])];
    const bounds = L.latLngBounds(allPoints);
    map.fitBounds(bounds, {
      paddingTopLeft: [30, 30],
      paddingBottomRight: [30, 90],
      maxZoom: 13,
      animate: true
    });

    renderSheet(markers);
    try { localStorage.setItem('spb_day', String(day)); } catch (e) {}
  }

  function renderSheet(markers) {
    const list = document.getElementById('sheetList');
    const data = DAYS[currentDay];
    list.innerHTML = '';

    // Стартовая карточка
    const startEl = document.createElement('div');
    startEl.className = 'step';
    startEl.innerHTML = `
      <div class="step-num start">🚩</div>
      <div class="step-info">
        <div class="step-name">Старт · ${data.startTime}</div>
        <div class="step-meta">${BASE.name}</div>
        <div class="step-note">${BASE.note}</div>
      </div>
    `;
    startEl.addEventListener('click', () => {
      map.setView([BASE.lat, BASE.lon], 14, { animate: true });
      markers[0].openPopup();
      closeSheet();
    });
    list.appendChild(startEl);

    // Чередуем transition + step
    let prevLat = BASE.lat, prevLon = BASE.lon;
    data.places.forEach((p, i) => {
      if (p.arriveBy) {
        const transEl = document.createElement('div');
        transEl.innerHTML = transitionHtml(p.arriveBy, prevLat, prevLon, p.lat, p.lon);
        list.appendChild(transEl.firstElementChild);
      }

      const stepEl = document.createElement('div');
      stepEl.className = 'step';
      stepEl.innerHTML = `
        <div class="step-num" style="background:${data.color}">${i + 1}</div>
        <div class="step-info">
          <div class="step-name">${p.name}</div>
          <div class="step-meta">${p.time} · ${p.dur}</div>
          <div class="step-note">${p.note}</div>
        </div>
      `;
      const idx = i + 1; // marker index (0 = start)
      stepEl.addEventListener('click', () => {
        map.setView([p.lat, p.lon], 16, { animate: true });
        if (markers[idx]) markers[idx].openPopup();
        closeSheet();
      });
      list.appendChild(stepEl);

      prevLat = p.lat; prevLon = p.lon;
    });

    // Возврат к базе
    if (data.returnTo) {
      const transEl = document.createElement('div');
      transEl.innerHTML = transitionHtml(data.returnTo, prevLat, prevLon, BASE.lat, BASE.lon);
      list.appendChild(transEl.firstElementChild);

      const finishEl = document.createElement('div');
      finishEl.className = 'step';
      finishEl.innerHTML = `
        <div class="step-num start">🏁</div>
        <div class="step-info">
          <div class="step-name">Возврат к «Парк Победы»</div>
          <div class="step-meta">Конец дня</div>
        </div>
      `;
      finishEl.addEventListener('click', () => {
        map.setView([BASE.lat, BASE.lon], 14, { animate: true });
        markers[0].openPopup();
        closeSheet();
      });
      list.appendChild(finishEl);
    }
  }

  function buildRainLayer() {
    rainLayer.clearLayers();
    RAIN_PLACES.forEach(p => {
      L.marker([p.lat, p.lon], { icon: makeRainIcon() })
        .bindPopup(`
          <div class="popup-title">${p.name}</div>
          <div class="popup-note">${p.note}</div>
          <a class="popup-btn" href="${ymPoint(p.lat, p.lon, p.name)}" target="_blank" rel="noopener">Открыть в Я.Картах</a>
        `).addTo(rainLayer);
    });
  }
  buildRainLayer();

  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => renderDay(Number(t.dataset.day)));
  });

  const rainBtn = document.getElementById('rainToggle');
  rainBtn.addEventListener('click', () => {
    rainOn = !rainOn;
    if (rainOn) {
      rainLayer.addTo(map);
      rainBtn.classList.add('active');
      rainBtn.textContent = 'Скрыть места на случай дождя ☔';
    } else {
      map.removeLayer(rainLayer);
      rainBtn.classList.remove('active');
      rainBtn.textContent = 'Показать места на случай дождя ☔';
    }
  });

  const sheet = document.getElementById('sheet');
  const sheetHandle = document.getElementById('sheetHandle');
  function toggleSheet() { sheet.classList.toggle('open'); }
  function closeSheet() { sheet.classList.remove('open'); }
  sheetHandle.addEventListener('click', toggleSheet);

  let startDay = 1;
  try {
    const saved = localStorage.getItem('spb_day');
    if (saved && DAYS[saved]) startDay = Number(saved);
  } catch (e) {}
  renderDay(startDay);

  setTimeout(() => map.invalidateSize(), 50);
  window.addEventListener('resize', () => map.invalidateSize());
</script>
</body>
</html>
