<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Питер за 3 дня 🌉</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --accent: #1B365D;
    --day1: #1B365D;
    --day2: #C9A227;
    --day3: #7B2D26;
    --rain: #6B6B6B;
    --start: #2F8F4E;
    --user: #2563EB;
    --warn: #DC2626;
    --bg: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color: var(--text);
    background: var(--bg);
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; flex-direction: column;
    height: 100vh; height: 100dvh;
    overflow: hidden;
  }
  header {
    padding: 12px 16px 6px;
    background: #fff;
    z-index: 500;
  }
  header h1 {
    margin: 0 0 2px 0;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.2px;
  }
  header .subtitle {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }
  .tabs {
    display: flex;
    gap: 6px;
    padding: 8px 16px 0;
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: #f3f4f6;
    border-radius: 12px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    font-family: inherit;
  }
  .tab .progress {
    font-size: 11px;
    opacity: 0.7;
    margin-left: 3px;
    font-weight: 600;
  }
  .tab.active { background: var(--accent); color: white; }
  .toolbar {
    display: flex;
    gap: 6px;
    padding: 8px 16px 10px;
  }
  .toolbar button {
    flex: 1;
    padding: 9px 8px;
    background: #f3f4f6;
    border: none;
    border-radius: 12px;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    color: var(--text);
    transition: background 0.2s, color 0.2s;
  }
  .toolbar button.active.locate { background: var(--user); color: white; }
  .toolbar button.active.rain { background: var(--rain); color: white; }
  #map {
    flex: 1;
    width: 100%;
    z-index: 1;
  }
  .marker-pin {
    width: 32px; height: 32px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    border: 2px solid white;
  }
  .marker-pin span {
    transform: rotate(45deg);
    color: white;
    font-weight: 700;
    font-size: 13px;
    line-height: 1;
  }
  .marker-pin.visited {
    background: #b8b8b8 !important;
  }
  .marker-pin.visited span::before {
    content: '✓';
  }
  .marker-pin.visited span { font-size: 0; }
  .marker-pin.visited span::before { font-size: 15px; }
  .marker-rain {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: var(--rain);
    border: 2px solid white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
  }
  .marker-start {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--start);
    border: 3px solid white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .marker-user {
    width: 20px; height: 20px;
    border-radius: 50%;
    background: var(--user);
    border: 3px solid white;
    box-shadow: 0 0 0 2px rgba(37,99,235,0.3), 0 2px 6px rgba(0,0,0,0.3);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(37,99,235,0.5), 0 2px 6px rgba(0,0,0,0.3); }
    70% { box-shadow: 0 0 0 14px rgba(37,99,235,0), 0 2px 6px rgba(0,0,0,0.3); }
    100% { box-shadow: 0 0 0 0 rgba(37,99,235,0), 0 2px 6px rgba(0,0,0,0.3); }
  }
  .bottom-sheet {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #fff;
    border-radius: 16px 16px 0 0;
    box-shadow: 0 -4px 20px rgba(0,0,0,0.15);
    z-index: 600;
    max-height: 75vh;
    transform: translateY(calc(100% - 50px));
    transition: transform 0.3s ease;
    display: flex;
    flex-direction: column;
  }
  .bottom-sheet.open { transform: translateY(0); }
  .sheet-handle {
    padding: 8px 16px 6px;
    cursor: pointer;
    user-select: none;
    text-align: center;
  }
  .sheet-handle .bar {
    width: 40px; height: 4px;
    background: #d1d5db;
    border-radius: 2px;
    margin: 0 auto 6px;
  }
  .sheet-handle .label {
    font-size: 13px;
    font-weight: 500;
    color: var(--muted);
  }
  .sheet-list {
    overflow-y: auto;
    padding: 4px 12px 24px;
    -webkit-overflow-scrolling: touch;
  }
  .step {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 12px 8px 12px 10px;
    border-radius: 12px;
    transition: background 0.15s, opacity 0.2s;
    position: relative;
  }
  .step.tappable { cursor: pointer; }
  .step.tappable:active { background: #f3f4f6; }
  .step.visited { opacity: 0.55; }
  .step.visited .step-name { text-decoration: line-through; }
  .step-num {
    width: 30px; height: 30px;
    border-radius: 50%;
    color: white;
    font-weight: 700;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .step-num.start { background: var(--start); font-size: 16px; }
  .step-info { flex: 1; min-width: 0; }
  .step-name {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 2px;
    line-height: 1.25;
  }
  .step-meta {
    font-size: 12px;
    color: var(--muted);
  }
  .step-note {
    font-size: 12px;
    color: #555;
    margin-top: 4px;
    line-height: 1.4;
  }
  .step-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 6px;
  }
  .tag {
    font-size: 11px;
    padding: 2px 7px;
    border-radius: 6px;
    background: #f3f4f6;
    color: #444;
    white-space: nowrap;
  }
  .tag.warn {
    background: #FEE2E2;
    color: var(--warn);
    font-weight: 600;
  }
  .tag.dist {
    background: #DBEAFE;
    color: #1D4ED8;
    font-weight: 600;
  }
  .step-check {
    width: 30px; height: 30px;
    border: 2px solid #d1d5db;
    border-radius: 50%;
    background: white;
    color: transparent;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
    align-self: flex-start;
    margin-top: 1px;
    transition: all 0.15s;
    display: flex; align-items: center; justify-content: center;
  }
  .step-check.done {
    background: var(--start);
    border-color: var(--start);
    color: white;
  }
  .step-check:active { transform: scale(0.92); }
  .transition {
    margin: 2px 0 2px 26px;
    padding: 8px 12px 8px 20px;
    border-left: 2px dashed #cbd5e1;
    font-size: 12.5px;
    color: #444;
    line-height: 1.45;
  }
  .transition-mode {
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
  }
  .transition-mode .dur { color: var(--muted); font-weight: 500; font-size: 12px; }
  .transition-text { color: #444; margin-bottom: 6px; }
  .transition-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 5px 10px;
    background: #f3f4f6;
    border-radius: 8px;
    color: var(--accent);
    text-decoration: none;
    font-size: 11.5px;
    font-weight: 600;
  }
  .transition-btn:active { background: #e5e7eb; }
  .leaflet-popup-content-wrapper { border-radius: 14px; }
  .leaflet-popup-content {
    margin: 12px 14px;
    font-size: 13px;
    line-height: 1.45;
    width: 260px !important;
  }
  .popup-title {
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 4px;
    line-height: 1.3;
  }
  .popup-meta {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 6px;
  }
  .popup-warn {
    background: #FEE2E2;
    color: var(--warn);
    padding: 6px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .popup-arrive {
    background: #f3f4f6;
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 12px;
  }
  .popup-arrive-title {
    font-weight: 700;
    margin-bottom: 3px;
    color: var(--text);
  }
  .popup-arrive-text { color: #444; }
  .popup-info {
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
    font-size: 12px;
    background: #FEF3C7;
  }
  .popup-info-row {
    display: flex;
    gap: 6px;
    margin-bottom: 2px;
  }
  .popup-info-row:last-child { margin-bottom: 0; }
  .popup-info-label {
    color: #92400E;
    font-weight: 700;
    min-width: 50px;
  }
  .popup-info-value { color: #78350F; }
  .popup-note { margin-bottom: 10px; color: #333; }
  .popup-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .popup-btn {
    display: inline-block;
    padding: 7px 11px;
    background: var(--accent);
    color: white !important;
    text-decoration: none;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
  }
  .popup-btn.secondary { background: #f3f4f6; color: var(--accent) !important; }
  @media (min-width: 720px) {
    body { max-width: 720px; margin: 0 auto; box-shadow: 0 0 30px rgba(0,0,0,0.08); }
  }
</style>
</head>
<body>

<header>

  <p class="subtitle" id="subtitle">День 1 — «Открыточный Питер»</p>
</header>

<div class="tabs">
  <button class="tab active" data-day="1"><span class="tab-text">День 1</span></button>
  <button class="tab" data-day="2"><span class="tab-text">День 2</span></button>

<div id="map"></div>

<div class="bottom-sheet" id="sheet">

          arriveBy: { type: 'walk', dur: '~20 мин',
            text: '1.5 км: через Дворцовый мост → Стрелка Васильевского острова (Ростральные колонны) → Биржевой мост → Иоанновский мост. Один из самых открыточных пеших маршрутов города.' },
          note: 'Место, откуда начался Петербург в 1703 году. В 12:00 стреляет полуденная пушка.' },

        { name: 'Севкабель Порт', lat: 59.9243343, lon: 30.2410502, time: '18:30', dur: '180 мин',
          hours: 'Территория круглосуточно, заведения до 23:00+',
          closedDays: [],
          price: 'Вход бесплатный',
          arriveBy: { type: 'taxi', dur: '~15 мин',
            text: 'Такси от Петропавловки на Васильевский остров, ~400–500₽. Альтернатива: автобус 49 от Кронверкского пр., ~30 мин.' },
          note: 'Бывший кабельный завод, теперь главное модное пространство города. Закат над Финским заливом — лучший в городе.' }
      ],
      returnTo: { type: 'taxi', dur: '~25 мин',
        text: 'От Севкабеля — такси до «Парк Победы», ~600–800₽. Или метро: пешком 15 мин до «Василеостровской» (М3) → «Гостиный двор» → переход на «Невский проспект» (М2) → 7 ост. до «Парк Победы», ~50 мин.' }
    }
  };

  const RAIN_PLACES = [
    { name: 'Русский музей, Михайловский дворец', lat: 59.938935, lon: 30.332168, hours: '10:00–18:00 (Чт до 20:00)', closedDays: [2], price: '500 ₽', note: 'Вся русская живопись: Айвазовский, Репин, Брюллов.' },
    { name: 'Музей Фаберже, Шуваловский дворец', lat: 59.937, lon: 30.343, hours: '10:00–20:45', closedDays: [], price: '550 ₽', note: 'Яйца Фаберже из императорской коллекции.' },
    { name: 'Юсуповский дворец на Мойке', lat: 59.929, lon: 30.299, hours: '11:00–17:00', closedDays: [], price: '850 ₽ парадные залы', note: 'Где убили Распутина, экскурсия с восковыми фигурами.' },
    { name: 'Дом Зингера / Дом книги', lat: 59.935, lon: 30.325, hours: '09:00–23:00', closedDays: [], price: 'Бесплатно', note: 'Кафе на 2-м этаже с видом на Казанский собор.' },
    { name: 'Музей Эрарта', lat: 59.929, lon: 30.236, hours: '10:00–22:00', closedDays: [], price: '900 ₽', note: 'Современное искусство, открыт до 22:00.' }
  ];

  // State
  let currentDay = 1;
  let rainOn = false;
  let userPos = null; // {lat, lon, accuracy}
  let userMarker = null;
  let userAccuracyCircle = null;

  let visited = {};
  try { visited = JSON.parse(localStorage.getItem('spb_visited') || '{}'); } catch (e) { visited = {}; }
  function saveVisited() { try { localStorage.setItem('spb_visited', JSON.stringify(visited)); } catch (e) {} }
  function isVisited(day, idx) { return !!visited[`${day}-${idx}`]; }
  function toggleVisited(day, idx) {
    const k = `${day}-${idx}`;
    if (visited[k]) delete visited[k]; else visited[k] = true;
    saveVisited();
  }

  const map = L.map('map', { zoomControl: true }).setView([59.94, 30.32], 12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© OpenStreetMap'
  }).addTo(map);

  const dayLayer = L.layerGroup().addTo(map);
  const rainLayer = L.layerGroup();

  function makeNumberIcon(num, color, visited) {
    const cls = visited ? 'marker-pin visited' : 'marker-pin';
    const bg = visited ? '#b8b8b8' : color;
    return L.divIcon({
      className: 'spb-marker',
      html: `<div class="${cls}" style="background:${bg}"><span>${num}</span></div>`,
      iconSize: [32, 42], iconAnchor: [16, 38], popupAnchor: [0, -34]
    });
  }
  function makeStartIcon() {
    return L.divIcon({
      className: 'spb-marker',
      html: `<div class="marker-start">🚩</div>`,
      iconSize: [36, 36], iconAnchor: [18, 18], popupAnchor: [0, -18]
    });
  }
  function makeRainIcon() {
    return L.divIcon({
      className: 'spb-marker',
      html: `<div class="marker-rain">☔</div>`,
      iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -18]
    });
  }
  function makeUserIcon() {
    return L.divIcon({
      className: 'spb-marker',
      html: `<div class="marker-user"></div>`,
      iconSize: [20, 20], iconAnchor: [10, 10]
    });
  }

  // Distance (haversine)
  function distanceMeters(lat1, lon1, lat2, lon2) {
    const R = 6371000;
    const toRad = x => x * Math.PI / 180;
    const dLat = toRad(lat2 - lat1);
    const dLon = toRad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }
  function fmtDistance(m) {
    if (m < 1000) return `${Math.round(m / 10) * 10} м`;
    return `${(m / 1000).toFixed(1)} км`;
  }
  function walkMinutes(m) {
    // ~80 м/мин с поправкой на изгибы пути 1.3
    return Math.max(1, Math.round((m * 1.3) / 80));
  }

  function ymRoute(fromLat, fromLon, toLat, toLon, mode) {
    return `https://yandex.ru/maps/?rtext=${fromLat},${fromLon}~${toLat},${toLon}&rtt=${mode}`;
  }
  function ymPoint(lat, lon, name) {
    return `https://yandex.ru/maps/?rtext=~${lat},${lon}&rtt=auto&text=${encodeURIComponent(name)}`;
  }

  function closedBadge(closedDays) {
    if (!closedDays || !closedDays.length) return '';
    const today = new Date().getDay();
    const isClosedToday = closedDays.includes(today);
    const names = closedDays.map(d => WEEKDAYS[d]).join(', ');
    if (isClosedToday) return `<span class="tag warn">⚠️ Сегодня закрыто (${names})</span>`;
    return `<span class="tag">Закрыто: ${names}</span>`;
  }

  function closedWarnPopup(closedDays) {
    if (!closedDays || !closedDays.length) return '';
    const today = new Date().getDay();
    const isClosedToday = closedDays.includes(today);
    if (!isClosedToday) return '';
    return `<div class="popup-warn">⚠️ Сегодня (${WEEKDAY_FULL[today]}) место закрыто</div>`;
  }

  function distanceTag(lat, lon) {
    if (!userPos) return '';
    const m = distanceMeters(userPos.lat, userPos.lon, lat, lon);
    return `<span class="tag dist">📍 ${fmtDistance(m)} · ${walkMinutes(m)} мин пешком</span>`;
  }

  function transitionHtml(t, fromLat, fromLon, toLat, toLon) {
    const m = MODE[t.type] || MODE.walk;
    const url = ymRoute(fromLat, fromLon, toLat, toLon, m.ym);
    return `
      <div class="transition">
        <div class="transition-mode">
          <span>${m.icon}</span>
          <span>${m.label}</span>
          <span class="dur">· ${t.dur}</span>
        </div>
        <div class="transition-text">${t.text}</div>
        <a class="transition-btn" href="${url}" target="_blank" rel="noopener">Маршрут в Я.Картах →</a>
      </div>
    `;
  }

  function popupArriveHtml(t) {
    if (!t) return '';
    const m = MODE[t.type] || MODE.walk;
    return `
      <div class="popup-arrive">
        <div class="popup-arrive-title">${m.icon} ${m.label} · ${t.dur}</div>
        <div class="popup-arrive-text">${t.text}</div>
      </div>
    `;
  }

  function popupInfoBlock(p) {
    if (!p.hours && !p.price && !(p.closedDays && p.closedDays.length)) return '';
    const closed = (p.closedDays && p.closedDays.length) ? WEEKDAYS.filter((_, i) => p.closedDays.includes(i)).join(', ') : '';
    return `
      <div class="popup-info">
        ${p.hours ? `<div class="popup-info-row"><span class="popup-info-label">🕒</span><span class="popup-info-value">${p.hours}</span></div>` : ''}
        ${closed ? `<div class="popup-info-row"><span class="popup-info-label">🚫</span><span class="popup-info-value">Выходной: ${closed}</span></div>` : ''}
        ${p.price ? `<div class="popup-info-row"><span class="popup-info-label">💰</span><span class="popup-info-value">${p.price}</span></div>` : ''}
      </div>
    `;
  }

  function popupHtml(p, prevLat, prevLon) {
    const web = ymPoint(p.lat, p.lon, p.name);
    const meta = p.time ? `${p.time}${p.dur ? ' · ' + p.dur : ''}` : '';
    let routeBtn = '';
    if (p.arriveBy && prevLat != null) {
      const m = MODE[p.arriveBy.type] || MODE.walk;
      const url = ymRoute(prevLat, prevLon, p.lat, p.lon, m.ym);
      routeBtn = `<a class="popup-btn secondary" href="${url}" target="_blank" rel="noopener">${m.icon} Маршрут сюда</a>`;
    }
    let userBtn = '';
    if (userPos) {
      const url = ymRoute(userPos.lat, userPos.lon, p.lat, p.lon, 'pd');
      const m = distanceMeters(userPos.lat, userPos.lon, p.lat, p.lon);
      userBtn = `<a class="popup-btn secondary" href="${url}" target="_blank" rel="noopener">📍 От меня · ${fmtDistance(m)}</a>`;
    }
    return `
      <div class="popup-title">${p.name}</div>
      ${meta ? `<div class="popup-meta">${meta}</div>` : ''}
      ${closedWarnPopup(p.closedDays)}
      ${popupInfoBlock(p)}
      ${popupArriveHtml(p.arriveBy)}
      <div class="popup-note">${p.note}</div>
      <div class="popup-btns">
        <a class="popup-btn" href="${web}" target="_blank" rel="noopener">Открыть в Я.Картах</a>
        ${userBtn}
        ${routeBtn}
      </div>
    `;
  }

  function popupStartHtml() {
    let userBtn = '';
    if (userPos) {
      const url = ymRoute(userPos.lat, userPos.lon, BASE.lat, BASE.lon, 'pd');
      const m = distanceMeters(userPos.lat, userPos.lon, BASE.lat, BASE.lon);
      userBtn = `<a class="popup-btn secondary" href="${url}" target="_blank" rel="noopener">📍 От меня · ${fmtDistance(m)}</a>`;
    }
    return `
      <div class="popup-title">🚩 ${BASE.name}</div>
      <div class="popup-note">${BASE.note}</div>
      ${userBtn ? `<div class="popup-btns">${userBtn}</div>` : ''}
    `;
  }

  function popupRainHtml(p) {
    let userBtn = '';
    if (userPos) {
      const url = ymRoute(userPos.lat, userPos.lon, p.lat, p.lon, 'pd');
      const m = distanceMeters(userPos.lat, userPos.lon, p.lat, p.lon);
      userBtn = `<a class="popup-btn secondary" href="${url}" target="_blank" rel="noopener">📍 От меня · ${fmtDistance(m)}</a>`;
    }
    return `
      <div class="popup-title">${p.name}</div>
      ${closedWarnPopup(p.closedDays)}
      ${popupInfoBlock(p)}
      <div class="popup-note">${p.note}</div>
      <div class="popup-btns">
        <a class="popup-btn" href="${ymPoint(p.lat, p.lon, p.name)}" target="_blank" rel="noopener">Открыть в Я.Картах</a>
        ${userBtn}
      </div>
    `;
  }

  function segmentStyle(type, color) {
    const base = { color, weight: 4, opacity: 0.8 };
    switch (type) {
      case 'walk':  return { ...base, dashArray: '2, 7', weight: 3 };
      case 'metro': return { ...base, dashArray: '16, 8', weight: 5 };
      case 'mixed': return { ...base, dashArray: '12, 6', weight: 4 };
      case 'taxi':  return { ...base, dashArray: '1, 6', weight: 3, opacity: 0.65 };
      case 'boat':  return { ...base, dashArray: '8, 4, 1, 4', weight: 4 };
      case 'bus':
      case 'train': return { ...base, dashArray: '10, 6', weight: 4 };
      default: return base;
    }
  }

  function updateTabLabels() {
    document.querySelectorAll('.tab').forEach(t => {
      const d = Number(t.dataset.day);
      const total = DAYS[d].places.length;
      let done = 0;
      for (let i = 0; i < total; i++) if (isVisited(d, i)) done++;
      const txt = t.querySelector('.tab-text');
      txt.innerHTML = `День ${d}${done > 0 ? ` <span class="progress">${done}/${total}</span>` : ''}`;
    });
  }

  let currentMarkers = [];

  function renderDay(day) {
    currentDay = day;
    dayLayer.clearLayers();
    const data = DAYS[day];
    document.getElementById('subtitle').textContent = data.title;
    document.getElementById('sheetLabel').textContent = `Пошаговый маршрут · ${data.places.length} точек ↑`;
    document.querySelectorAll('.tab').forEach(t => {
      t.classList.toggle('active', t.dataset.day === String(day));
    });

    currentMarkers = [];

    const startMarker = L.marker([BASE.lat, BASE.lon], { icon: makeStartIcon() })
      .bindPopup(popupStartHtml());
    startMarker.addTo(dayLayer);
    currentMarkers.push(startMarker);

    let prevLat = BASE.lat, prevLon = BASE.lon;
    data.places.forEach((p, i) => {
      if (p.arriveBy) {
        const style = segmentStyle(p.arriveBy.type, data.color);
        L.polyline([[prevLat, prevLon], [p.lat, p.lon]], style).addTo(dayLayer);
      }
      const v = isVisited(day, i);
      const marker = L.marker([p.lat, p.lon], { icon: makeNumberIcon(i + 1, data.color, v) })
        .bindPopup(popupHtml(p, prevLat, prevLon));
      marker.addTo(dayLayer);
      currentMarkers.push(marker);
      prevLat = p.lat; prevLon = p.lon;
    });

    if (data.returnTo) {
      const style = segmentStyle(data.returnTo.type, data.color);
      style.opacity = 0.5;
      L.polyline([[prevLat, prevLon], [BASE.lat, BASE.lon]], style).addTo(dayLayer);
    }

    const allPoints = [[BASE.lat, BASE.lon], ...data.places.map(p => [p.lat, p.lon])];
    const bounds = L.latLngBounds(allPoints);
    map.fitBounds(bounds, {
      paddingTopLeft: [30, 30],
      paddingBottomRight: [30, 90],
      maxZoom: 13,
      animate: true
    });

    renderSheet();
    updateTabLabels();
    try { localStorage.setItem('spb_day', String(day)); } catch (e) {}
  }

  function renderSheet() {
    const list = document.getElementById('sheetList');
    const data = DAYS[currentDay];
    list.innerHTML = '';

    const startEl = document.createElement('div');
    startEl.className = 'step tappable';
    startEl.innerHTML = `
      <div class="step-num start">🚩</div>
      <div class="step-info">
        <div class="step-name">Старт · ${data.startTime}</div>
        <div class="step-meta">${BASE.name}</div>
        <div class="step-note">${BASE.note}</div>
        ${userPos ? `<div class="step-tags">${distanceTag(BASE.lat, BASE.lon)}</div>` : ''}
      </div>
    `;
    startEl.addEventListener('click', () => {
      map.setView([BASE.lat, BASE.lon], 14, { animate: true });
      currentMarkers[0].openPopup();
      closeSheet();
    });
    list.appendChild(startEl);

    let prevLat = BASE.lat, prevLon = BASE.lon;
    data.places.forEach((p, i) => {
      if (p.arriveBy) {
        const transEl = document.createElement('div');
        transEl.innerHTML = transitionHtml(p.arriveBy, prevLat, prevLon, p.lat, p.lon);
        list.appendChild(transEl.firstElementChild);
      }

      const v = isVisited(currentDay, i);
      const tags = [
        p.hours ? `<span class="tag">🕒 ${p.hours.split(',')[0]}</span>` : '',
        p.price && !/бесплатно/i.test(p.price) ? `<span class="tag">💰 ${p.price.split(';')[0].split(',')[0]}</span>` : (p.price ? `<span class="tag">💰 Бесплатно</span>` : ''),
        closedBadge(p.closedDays),
        distanceTag(p.lat, p.lon)
      ].filter(Boolean).join('');

      const stepEl = document.createElement('div');
      stepEl.className = 'step tappable' + (v ? ' visited' : '');
      stepEl.innerHTML = `
        <div class="step-num" style="background:${v ? '#b8b8b8' : data.color}">${v ? '✓' : (i + 1)}</div>
        <div class="step-info">
          <div class="step-name">${p.name}</div>
          <div class="step-meta">${p.time} · ${p.dur}</div>
          <div class="step-note">${p.note}</div>
          ${tags ? `<div class="step-tags">${tags}</div>` : ''}
        </div>
        <button class="step-check ${v ? 'done' : ''}" aria-label="Отметить как посещённое">✓</button>
      `;
      const idx = i + 1;
      stepEl.addEventListener('click', () => {
        map.setView([p.lat, p.lon], 16, { animate: true });
        if (currentMarkers[idx]) currentMarkers[idx].openPopup();
        closeSheet();
      });
      const checkBtn = stepEl.querySelector('.step-check');
      checkBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleVisited(currentDay, i);
        renderDay(currentDay);
      });
      list.appendChild(stepEl);

      prevLat = p.lat; prevLon = p.lon;
    });

    if (data.returnTo) {
      const transEl = document.createElement('div');
      transEl.innerHTML = transitionHtml(data.returnTo, prevLat, prevLon, BASE.lat, BASE.lon);
      list.appendChild(transEl.firstElementChild);

      const finishEl = document.createElement('div');
      finishEl.className = 'step tappable';
      finishEl.innerHTML = `
        <div class="step-num start">🏁</div>
        <div class="step-info">
          <div class="step-name">Возврат к «Парк Победы»</div>
          <div class="step-meta">Конец дня</div>
        </div>
      `;
      finishEl.addEventListener('click', () => {
        map.setView([BASE.lat, BASE.lon], 14, { animate: true });
        currentMarkers[0].openPopup();
        closeSheet();
      });
      list.appendChild(finishEl);
    }
  }

  function buildRainLayer() {
    rainLayer.clearLayers();
    RAIN_PLACES.forEach(p => {
      L.marker([p.lat, p.lon], { icon: makeRainIcon() })
        .bindPopup(popupRainHtml(p)).addTo(rainLayer);
    });
  }
  buildRainLayer();

  // Geolocation
  const locateBtn = document.getElementById('locateBtn');
  locateBtn.addEventListener('click', () => {
    if (!navigator.geolocation) {
      alert('Геолокация не поддерживается в этом браузере');
      return;
    }
    locateBtn.textContent = '⏳ Ищу…';
    locateBtn.disabled = true;
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        userPos = { lat: pos.coords.latitude, lon: pos.coords.longitude, accuracy: pos.coords.accuracy };
        if (userMarker) map.removeLayer(userMarker);
        if (userAccuracyCircle) map.removeLayer(userAccuracyCircle);
        userMarker = L.marker([userPos.lat, userPos.lon], { icon: makeUserIcon(), zIndexOffset: 1000 })
          .bindPopup('<div class="popup-title">📍 Вы здесь</div>')
          .addTo(map);
        userAccuracyCircle = L.circle([userPos.lat, userPos.lon], {
          radius: userPos.accuracy,
          color: '#2563EB',
          fillColor: '#2563EB',
          fillOpacity: 0.08,
          weight: 1
        }).addTo(map);
        map.setView([userPos.lat, userPos.lon], 14, { animate: true });
        locateBtn.textContent = '📍 Я здесь';
        locateBtn.disabled = false;
        locateBtn.classList.add('active');
        renderDay(currentDay);
        buildRainLayer();
      },
      (err) => {
        locateBtn.textContent = '📍 Я здесь';
        locateBtn.disabled = false;
        alert('Не удалось определить местоположение: ' + (err.message || 'разрешите доступ к геолокации'));
      },
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
    );
  });

  // Tabs
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => renderDay(Number(t.dataset.day)));
  });

  // Rain toggle
  const rainBtn = document.getElementById('rainToggle');
  rainBtn.addEventListener('click', () => {
    rainOn = !rainOn;
    if (rainOn) {
      rainLayer.addTo(map);
      rainBtn.classList.add('active');
    } else {
      map.removeLayer(rainLayer);
      rainBtn.classList.remove('active');
    }
  });

  // Sheet
  const sheet = document.getElementById('sheet');
  const sheetHandle = document.getElementById('sheetHandle');
  function toggleSheet() { sheet.classList.toggle('open'); }
  function closeSheet() { sheet.classList.remove('open'); }
  sheetHandle.addEventListener('click', toggleSheet);

  let startDay = 1;
  try {
    const saved = localStorage.getItem('spb_day');
    if (saved && DAYS[saved]) startDay = Number(saved);
  } catch (e) {}
  renderDay(startDay);
  updateTabLabels();

  setTimeout(() => map.invalidateSize(), 50);
  window.addEventListener('resize', () => map.invalidateSize());
</script>
</body>
</html>
